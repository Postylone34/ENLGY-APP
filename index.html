<div class="hero"><div><h1>¡Hola, ${esc(S.name)}!</h1><span class="pill">${ic('flame',14)} ${S.streak} ${S.streak==1?'día':'días'} seguidos</span><div class="bub" data-a="engy">${MSG[S.m]}</div></div>${M(S.pet)}</div>
<div class="c hl tap" data-a="lesson:${curIdx()}"><small>Continúa tu lección</small><h2>${cur().t}</h2>${bar(cur().p)}<div class="row"><small>${cur().p}%</small><button class="btn p">Continuar →</button></div></div>
<h3>Para ti hoy</h3><div class="g2">
<div class="c tap" data-a="go:lessons"><div class="ic" style="background:var(--blue)">${ic('cal',20)}</div><b>Lección del día</b><small>${S.L[1].t}</small></div>
<div class="c tap" data-a="quiz:start"><div class="ic" style="background:var(--orange)">${ic('bolt',20)}</div><b>Repaso rápido</b><small>Mini-juego de vocabulario</small></div></div>
<div class="c tap" data-a="chat:open" style="display:flex;align-items:center;gap:10px"><div class="ic" style="background:var(--pink)">${ic('chat',20)}</div><div><b>Habla con ${PETS[S.pet]}</b><br><small>Practica una conversación en inglés</small></div></div>`;
const lessons=()=>`<h1>Lecciones</h1>`+S.L.map((l,i)=>`<div class="c"><h2>${l.t}</h2><small>${l.d}</small>${bar(l.p)}<div class="row"><small>${l.p}%</small><button class="btn p" data-a="lesson:${i}">${l.p?(l.p>=100?'Repasar':'Continuar'):'Empezar'}</button></div></div>`).join('');
function lesson(){const li=S.lview.li,L=S.L[li],D=LD[li],st=S.lview.step;
if(st==4)return `<div class="c" style="text-align:center">${M(S.pet,1)}<h2>¡Lección completada!</h2><p>Acertaste ${S.lview.score} de 3 actividades. ${PETS[S.pet]} está muy orgulloso de ti.</p><button class="btn p" data-a="lclose">Volver</button></div>`;
const back=`<button class="back" data-a="lclose">← ${esc(L.t)}</button>`;
if(st==0)return back+`<div class="row" style="justify-content:flex-start;gap:10px">${M(S.pet)}<h1 style="margin:0">${esc(L.t)}</h1></div><div class="c"><p>${esc(D.expl)}</p><button class="btn p" data-a="lstart">Comenzar actividades →</button></div>`;
const act=[D.match,D.fill,D.mc][st-1],qt=st==1?`¿Qué significa "${act.q}"?`:(st==2?act.s:act.q);
return back+`<div class="chip">Actividad ${st} de 3</div><div class="c"><p>${esc(qt)}</p>${act.o.map((o,i)=>`<button class="opt tap ${S.lview.open===i?(i==act.a?'ok':'bad'):''}" data-a="lans:${i}:${act.a}">${o}</button>`).join('')}</div><div class="row"><button class="btn p" data-a="lnext">Siguiente →</button></div>${bar(st*25)}`}
function practice(){
if(S.pview=='gr'){const q=LD[S.i%LD.length].fill;return `<button class="back" data-a="pv:0">← Práctica</button><div class="chip">Gramática</div><div class="c"><p>${esc(q.s)}</p>${q.o.map((o,i)=>`<button class="opt tap ${S.open===i?(i==q.a?'ok':'bad'):''}" data-a="ga:${i}:${q.a}">${o}</button>`).join('')}<div class="row" style="margin-top:8px"><button class="btn p" data-a="gnext">Siguiente →</button></div></div>`}
if(S.pview=='li')return `<button class="back" data-a="pv:0">← Práctica</button><div class="chip">Listening</div><div class="c"><div class="row tap" data-a="play" style="justify-content:flex-start;gap:10px"><div class="ic" style="background:var(--blue)">${ic('play',18)}</div><div><b>Audio: "A trip to the city"</b><br><small>0:42</small></div></div><h3>¿Qué ciudad visitó?</h3>${['Madrid','London','Lima'].map((o,i)=>`<button class="opt tap ${S.open===i?(i==1?'ok':'bad'):''}" data-a="la:${i}:1">${o}</button>`).join('')}</div>`;
if(S.pview=='sp')return `<button class="back" data-a="pv:0">← Práctica</button><div class="chip">Speaking</div><div class="c" style="text-align:center"><p>Lee en voz alta:</p><h2>"The weather is beautiful today."</h2><button class="btn p tap" data-a="rec">${ic('mic',16)} ${S.open?'Detener grabación':'Grabar'}</button>${S.open?'<p><small>🎙️ Grabando… toca para enviar a revisión.</small></p>':''}</div>`;
if(S.pview=='q'){if(S.quiz&&S.quiz.i>=QUIZ.length)return `<button class="back" data-a="pv:0">← Práctica</button><div class="c" style="text-align:center">${M(S.pet,1)}<h2>¡Buen trabajo!</h2><p>Puntaje: ${S.quiz.sc}/${QUIZ.length}</p><button class="btn p" data-a="pv:0">Volver</button></div>`;
const qz=S.quiz||{i:0,sc:0,sel:null},q=QUIZ[qz.i];return `<button class="back" data-a="pv:0">← Práctica</button><div class="chip">Quiz rápido • ${qz.i+1}/${QUIZ.length}</div><div class="c"><p>${esc(q.q)}</p>${q.o.map((o,i)=>`<button class="opt tap ${qz.sel===i?(i==q.a?'ok':'bad'):''}" data-a="qa:${i}:${q.a}">${o}</button>`).join('')}</div>`}
return `<h1>Práctica</h1><div class="g2">
<div class="c tap big" data-a="pv:gr"><div class="ic" style="background:var(--blue)">${ic('gr',22)}</div><b>Gramática</b></div>
<div class="c tap big" data-a="pv:li"><div class="ic" style="background:var(--green)">${ic('li',22)}</div><b>Listening</b></div>
<div class="c tap big" data-a="pv:sp"><div class="ic" style="background:var(--orange)">${ic('mic',22)}</div><b>Speaking</b></div>
<div class="c tap big" data-a="quiz:start"><div class="ic" style="background:var(--purple)">${ic('q',22)}</div><b>Quiz rápido</b></div></div>
<div class="c tap" data-a="chat:open" style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div class="ic" style="background:var(--pink)">${ic('chat',20)}</div><b>Chatbot de conversación</b></div>
<h3>Ejercicios recientes</h3>`+S.E.map(e=>`<div class="c row" style="padding:10px 14px"><div><b>${e.n}</b><br><small>${e.t} • ${e.s}</small></div><button class="btn tap" data-a="redo">${ic('redo',16)}</button></div>`).join('');}
function vocab(){const d=deck(),n=d.length,w=d[S.i]||null,pc=Math.round(S.known.length/V.length*100);
let b=`<h1>Vocabulario</h1><input id="q" placeholder="Buscar palabras…" value="${esc(S.q)}"><div class="tabs"><button data-a="ft:flash" class="${S.ft=='flash'?'on':''}">Flashcards</button><button data-a="ft:list" class="${S.ft=='list'?'on':''}">Listas</button><button data-a="ft:dic" class="${S.ft=='dic'?'on':''}">Diccionario</button></div>`;
if(S.ft=='dic')return b+`<div class="dic">`+d.map(x=>`<div class="c"><div class="dw" style="font-size:24px">${x[4]}</div><div style="flex:1"><div class="row"><b>${x[0]}</b><button class="ib tap" data-a="speak:${x[0]}">${ic('sp',15)}</button></div><small>/${x[3]}/ • ${x[1]}</small><p style="margin:6px 0 4px;font-size:12.5px">"${esc(x[2])}"</p><button class="btn tap" style="font-size:11px" data-a="fav:${x[0]}">${S.fav.includes(x[0])?'★ En favoritos':'☆ Agregar a favoritos'}</button></div></div>`).join('')+`</div>`;
if(S.ft=='list'){if(S.open)return b+`<button class="back" data-a="listclose">← Listas</button><div class="c"><h2>${esc(S.open)}</h2>${LISTAS[S.open].map(w=>`<div class="row" style="padding:7px 0"><b>${w}</b>${ic('sp',16)}</div>`).join('')}</div>`;
return b+Object.keys(LISTAS).map(k=>`<div class="c row tap" data-a="list:${k}"><b>${k}</b><span>${LISTAS[k].length} palabras →</span></div>`).join('')}
if(!n)return b+'<div class="c" style="text-align:center">Sin resultados. Prueba otra búsqueda.</div>';
b+=`<div class="c fc tap" data-a="flip"><button class="btn sp" data-a="speak">${ic('sp',16)}</button><div>${S.flip?w[1]+'<small>'+w[2]+'</small>':`<div style="font-size:38px;line-height:1">${w[4]}</div>${w[0]}<small>/${w[3]}/</small>`}</div></div><div class="c"><small>Escribe tu propia oración usando "${w[0]}":</small><input id="sent" placeholder="Write a sentence with it…" value="${esc(S.sent)}"><button class="btn p tap" style="width:100%" data-a="check">Comprobar</button></div><p class="row" style="margin:14px 0 0"><small>Palabra ${S.i+1} de ${n}</small><small>${S.known.length}/${V.length} aprendidas</small></p>${bar(pc)}`;
return b}
function progress(){const k=S.known.length,dn=done(),mx=Math.max(6,...S.W),pt=S.W.map((v,i)=>[20+i*46.7,100-v/mx*78]);
if(S.showPet)return `<button class="back" data-a="petclose">← Perfil</button><h1>Elige tu mascota</h1>${petPick(S.pet)}`;
if(S.showAch)return `<button class="back" data-a="achclose">← Progreso</button><h1>Todos los logros</h1>`+ACH.map((m,i)=>{const got=[dn>=1,S.streak>=3,k>=10,dn>=3][i];return `<div class="c row"><div class="row" style="justify-content:flex-start;gap:10px"><span class="ic" style="background:${got?'var(--orange)':'var(--soft)'};color:${got?'#fff':'var(--mut)'}">${ic('medal',20)}</span><div><b>${m[0]}</b><br><small>${m[1]}</small></div></div>${got?'✅':''}</div>`}).join('');
const md=[['Principiante',dn>=1],['Consistencia',S.streak>=3],['Explorador',k>=10],['Maestro',dn>=3]],dk=S.theme=='dark';
return `<div class="row" style="justify-content:flex-start;gap:12px"><div class="av">${esc(S.name[0]||'?').toUpperCase()}</div><div><h1 style="margin:0">${esc(S.name)}</h1><small>Nivel ${1+Math.floor((k+dn*3)/10)}</small></div><div style="margin-left:auto">${M(S.pet,1)}</div></div>
<div class="c row"><b>Mascota: ${PETS[S.pet]}</b><button class="btn tap" data-a="petopen">Cambiar</button></div>
<div class="c row"><b>Modo oscuro</b><button class="sw tap ${dk?'on':''}" data-a="theme"><i></i></button></div>
<div class="st" style="margin-top:4px"><div class="c"><b>${S.streak}</b><small>Días seguidos</small></div><div class="c"><b>${k}</b><small>Palabras</small></div><div class="c"><b>${dn}</b><small>Lecciones</small></div></div>
<div class="row"><h3 style="margin:16px 0 8px">Logros recientes</h3><button class="btn tap" data-a="achopen" style="font-size:11px">Ver todos</button></div><div class="row" style="justify-content:flex-start;flex-wrap:wrap">${md.map((m,i)=>`<button class="md ${m[1]?'':'off'}" data-a="md:${i}"><span>${ic('medal',24)}</span>${m[0]}</button>`).join('')}</div>
<h3>Progreso semanal</h3><div class="c"><svg viewBox="0 0 320 120" width="100%" fill="none"><polyline points="${pt.map(p=>p.join(',')).join(' ')}" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pt.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--blue)"/>`).join('')}${DN.map((d,i)=>`<text x="${20+i*46.7}" y="116" text-anchor="middle" font-size="11" fill="var(--mut)">${d}</text>`).join('')}</svg></div>`}
function chat(){const m=S.chat;return `<button class="back" data-a="chat:close">← Chatbot</button><div class="row" style="justify-content:flex-start;gap:8px;margin-bottom:8px">${M(S.pet)}<div><b>${PETS[S.pet]}</b><br><small>Practica conversación en inglés</small></div></div>
<div class="msgs">${m.msgs.map(x=>`<div class="msg ${x.t}">${esc(x.v)}</div>`).join('')}</div>
<div class="row" style="gap:8px;margin-top:10px"><input id="ci" placeholder="Escribe en inglés…" value="${esc(m.draft)}" style="margin:0"><button class="ib tap" data-a="chat:mic">${ic('mic',18)}</button><button class="ib tap" data-a="chat:send">${ic('send',18)}</button></div>`}
const T=[['home','Inicio',home],['lessons','Lecciones',lessons,'book'],['practice','Práctica',practice,'target'],['vocab','Vocabulario',vocab,'aa'],['progress','Progreso',progress,'chart']];
function render(){const a=$('#app');
if(!S.name){a.innerHTML=`<div class="login">${M(S.pet)}<h1>Engly</h1><small>Elige tu mascota</small>${petPick(S.pet)}<input id="nm" placeholder="Tu nombre" maxlength="20"><button class="btn p" data-a="login">Entrar</button></div>`;return}
if(S.chat){a.innerHTML=`<main>${chat()}</main>`;setTimeout(()=>{const l=$('.msgs');if(l)l.scrollTop=l.scrollHeight;if(S.foc){const i=$('#ci');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}},0);return}
if(S.lview){a.innerHTML=`<main>${lesson()}</main>`;return}
const t=T.find(x=>x[0]==S.tab);a.innerHTML=`<main>${t[2]()}</main><button class="fab tap" data-a="chat:open">${ic('chat',22)}</button><nav>${T.map(x=>`<button data-a="tab:${x[0]}" class="${x[0]==S.tab?'on':''}">${ic(x[3]||x[0])}${x[1]}</button>`).join('')}</nav>`;
if(S.foc){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
function botReply(){const n=S.chat.n=(S.chat.n||0)+1;return TOPICS[n%TOPICS.length]}
function sendMsg(){const t=$('#ci')?$('#ci').value.trim():S.chat.draft.trim();if(!t)return;S.chat.draft='';S.chat.msgs.push({t:'me',v:t});
const hit=FIXES.find(f=>f[0].test(t));if(hit)S.chat.msgs.push({t:'fix',v:'✏️ Mejor di: "'+hit[1]+'" — '+hit[2]});
S.chat.msgs.push({t:'bot',v:botReply()});bump();render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const[a,v,v2]=el.dataset.a.split(':');S.foc=0;
if(a=='pet'){S.pet=+v;save()}
else if(a=='login'){const n=$('#nm').value.trim();if(!n){$('#nm').placeholder='Escribe tu nombre';return}S.name=n;S.streak=1;save();}
else if(a=='tab'||a=='go'){S.tab=v;S.i=0;S.flip=0;S.pview=null;S.open=null;S.quiz=null;S.showAch=0;S.showPet=0;S.lview=null}
else if(a=='bell'){S.bell=0;toast(PETS[S.pet]+': ¡no tienes avisos nuevos!')}
else if(a=='engy')S.m=(S.m+1)%MSG.length;
else if(a=='lesson'){S.lview={li:+v,step:0,score:0,open:null}}
else if(a=='lstart'){S.lview.step=1;S.lview.open=null}
else if(a=='lans'){if(S.lview.open!==null)return;const i=+v,c=+v2;S.lview.open=i;if(i==c){S.lview.score++;bump();sndOk();toast('¡Correcto!')}else{sndBad();toast('Respuesta incorrecta')}}
else if(a=='lnext'){S.lview.step++;S.lview.open=null;if(S.lview.step==4){S.L[S.lview.li].p=100;bump();toast('¡Lección completada! '+PETS[S.pet]+' celebra contigo')}}
else if(a=='lclose'){S.lview=null}
else if(a=='pv'){S.pview=v=='0'?null:v;S.open=null;S.i=0}
else if(a=='ga'){if(S.open!==null)return;S.open=+v;if(+v==+v2){bump();sndOk();toast('¡Correcto!')}else{sndBad();toast('Respuesta incorrecta')}}
else if(a=='gnext'){S.open=null;S.i++}
else if(a=='la'){if(S.open!==null)return;S.open=+v;if(+v==+v2){bump();sndOk();toast('¡Correcto!')}else{sndBad();toast('Intenta de nuevo')}}
else if(a=='play'){toast('▶️ Reproduciendo audio…')}
else if(a=='rec'){S.open=S.open?0:1;if(!S.open){bump();toast('Grabación enviada a revisión')}}
else if(a=='quiz:start'||a=='redo'){S.tab='practice';S.pview='q';S.quiz={i:0,sc:0,sel:null}}
else if(a=='qa'){if(S.quiz.sel!=null)return;const c=+v==+v2;S.quiz.sel=+v;S.quiz.corr=+v2;if(c){S.quiz.sc++;sndOk()}else sndBad();toast(c?'¡Correcto!':'Respuesta incorrecta');setTimeout(()=>{S.quiz.i++;S.quiz.sel=null;bump();render()},700)}
else if(a=='ft'){S.ft=v;S.open=null;S.sent=''}
else if(a=='list'){S.open=v}
else if(a=='listclose'){S.open=null}
else if(a=='fav'){const i=S.fav.indexOf(v);i<0?S.fav.push(v):S.fav.splice(i,1)}
else if(a=='flip')S.flip=S.flip?0:1;
else if(a=='speak'||a=='say'){const w=v||(deck()[S.i]||[''])[0];try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){}return}
else if(a=='check'){const word=(deck()[S.i]||[''])[0],txt=(S.sent||'').trim();const ok=new RegExp('\\b'+word+'\\b','i').test(txt)&&txt.split(/\s+/).length>=3;if(ok){const w=word;if(!S.known.includes(w)){S.known.push(w);if(S.known.length==10)toast('¡10 palabras! Nuevo logro')}sndOk();toast('¡Muy bien! Oración correcta');bump();adv()}else{sndBad();toast('Usa la palabra "'+word+'" en una oración completa')}}
else if(a=='md'){toast(ACH[v][1])}
else if(a=='achopen')S.showAch=1;
else if(a=='achclose')S.showAch=0;
else if(a=='petopen')S.showPet=1;
else if(a=='petclose'){S.showPet=0;save()}
else if(a=='theme'){S.theme=S.theme=='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',S.theme);save()}
else if(a=='chat'){if(v=='open'){if(!S.chat)S.chat={msgs:[{t:'bot',v:"Hi "+S.name+"! I'm "+PETS[S.pet]+". "+TOPICS[0]}],draft:'',n:0};S.chat.open=1}
else if(v=='close'){S.chat=null}
else if(v=='mic'){toast('🎙️ Escuchando…');setTimeout(()=>{S.chat.draft='I are happy today';S.foc=1;render()},700);return}
else if(v=='send')sendMsg()}
render()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;S.i=0;S.flip=0;S.sent='';S.foc=1;render()}else if(e.target.id=='ci'){S.chat.draft=e.target.value}else if(e.target.id=='sent'){S.sent=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='nm')document.querySelector('[data-a=login]').click();if(e.key=='Enter'&&e.target.id=='ci'){e.preventDefault();sendMsg()}});
load();render();
</script></body></html>
